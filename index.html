<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine Circle - Welcome</title>

<style>
/* ===== Cine Circle Cinematic Theme ===== */
body {
  font-family: "Poppins", sans-serif;
  text-align: center;
  margin: 0;
  padding: 0;
  color: #FFFFFF;
  background-image: url('background.jpeg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-height: 100vh;
  position: relative;
}

/* Overlay to darken bright background for readability */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: -1;
}

/* Logo styling */
.logo {
  width: 150px;
  height: 175px;
  border-radius: 20px;
  margin: 60px auto 20px;
  background-image: url('Cinecircle.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  box-shadow: 0 0 25px rgba(245,166,35,0.3);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.logo:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px rgba(245,166,35,0.5);
}

/* Review Box (Main Card) */
.review-box {
  background-color: rgba(28,28,28,0.95); /* soft black */
  border: 2px solid #F5A623; /* gold border */
  border-radius: 25px;
  width: 400px;
  margin: 40px auto;
  padding: 30px;
  box-shadow: 0 4px 25px rgba(0,0,0,0.5);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.review-box:hover {
  transform: translateY(-5px);
  box-shadow: 0 6px 35px rgba(245,166,35,0.3);
}

.review-box p {
  color: #F5A623; /* gold text */
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* Buttons (Cinematic Red + Gold Glow) */
.btn {
  border: 2px solid #F5A623; /* gold border */
  border-radius: 25px;
  color: #F5A623;
  background-color: transparent;
  padding: 10px 25px;
  margin: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn:hover {
  background: #E50914; /* cinematic red */
  color: #FFFFFF;
  border-color: #E50914;
  box-shadow: 0 0 20px #E50914;
}

/* Responsive Design */
@media (max-width: 600px) {
  .review-box {
    width: 80%;
    padding: 20px;
  }
}
</style>

</head>
<body>

        <p>Start and share your amazing reviews</p>

                <button class="btn">Register</button>
            </a>
            <a href="login.html" class="btn-link">
                <button class="btn"> Login </button> 
            </a>
    </div>

</body>
</html>
